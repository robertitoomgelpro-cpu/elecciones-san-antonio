<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#eef2f5;
    color:#20252b;
    line-height:1.6;
}

header{
    background:linear-gradient(135deg,#0b2239,#164e78,#2878a8);
    color:white;
    text-align:center;
    padding:45px 20px;
}

header h1{
    font-size:clamp(28px,5vw,46px);
    margin-bottom:8px;
}

header p{
    font-size:17px;
    opacity:.92;
}

nav{
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    background:#091b2d;
    box-shadow:0 3px 12px rgba(0,0,0,.25);
}

nav button{
    background:none;
    border:none;
    color:white;
    padding:15px 20px;
    cursor:pointer;
    font-size:15px;
    transition:.3s;
}

nav button:hover{
    background:#2878a8;
}

.container{
    width:92%;
    max-width:1200px;
    margin:35px auto;
}

.page{
    animation:entrada .5s ease;
}

@keyframes entrada{
    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.hero{
    background:white;
    padding:45px 30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    margin-bottom:30px;
}

.hero h2{
    color:#164e78;
    font-size:34px;
    margin-bottom:12px;
}

.hero p{
    max-width:850px;
    margin:auto;
}

.section-title{
    text-align:center;
    color:#164e78;
    margin:35px 0 20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
    gap:24px;
}

.card{
    background:white;
    border-radius:17px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.09);
    transition:.3s;
}

.card:hover{
    transform:translateY(-7px);
    box-shadow:0 12px 25px rgba(0,0,0,.15);
}

.photo{
    width:100%;
    height:280px;
    background:#dce5eb;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#52616d;
    padding:15px;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.card-content{
    padding:22px;
}

.card h3{
    color:#164e78;
    font-size:20px;
    margin-bottom:6px;
}

.party{
    color:#666;
    margin-bottom:12px;
    font-size:14px;
}

.tag{
    display:inline-block;
    background:#e6f1f8;
    color:#164e78;
    padding:5px 10px;
    border-radius:20px;
    font-size:13px;
    margin:3px;
}

.btn{
    display:inline-block;
    border:none;
    background:#176b9e;
    color:white;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
    margin-top:12px;
}

.btn:hover{
    background:#0d4568;
    transform:scale(1.03);
}

.info-box{
    background:white;
    padding:27px;
    border-radius:16px;
    margin-bottom:24px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.info-box h3{
    color:#164e78;
    margin-bottom:14px;
    font-size:23px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:15px;
}

.data{
    background:#f0f4f7;
    padding:15px;
    border-radius:9px;
}

.data strong{
    display:block;
    color:#174b70;
}

.list{
    padding-left:24px;
}

.list li{
    margin-bottom:9px;
}

.proposal{
    border-left:5px solid #2878a8;
    background:#f5f9fb;
    padding:15px;
    margin:12px 0;
    border-radius:0 9px 9px 0;
}

.good{
    border-left:6px solid #238636;
}

.good h3{
    color:#238636;
}

.bad{
    border-left:6px solid #d29922;
}

.bad h3{
    color:#9a6a00;
}

.ugly{
    border-left:6px solid #c62828;
}

.ugly h3{
    color:#c62828;
}

.notice{
    background:#fff8dc;
    border-left:5px solid #d9a400;
    padding:18px;
    border-radius:8px;
    margin:20px 0;
}

.back{
    margin-bottom:20px;
}

.source{
    word-break:break-word;
}

.source a{
    color:#176b9e;
}

footer{
    background:#091b2d;
    color:white;
    text-align:center;
    padding:30px 20px;
    margin-top:50px;
}

footer a{
    color:#7fc8f5;
}

.profile-photo{
    max-width:360px;
    height:420px;
    margin:0 auto 20px;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.profile-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

@media(max-width:600px){

    .container{
        width:94%;

    }

    .hero h2{

    .photo{

    .profile-photo{

    }
}

</style>

    <div class="photo">

    </div>


    <div class="card-content">

        <h3>

        <button

            onclick="ir('candidato${c.id}')">

        </button>

    </div>

</div>

`).join("")}

</div>

</div>

`;

}

/* =====================================================
   CARGAR LA PÁGINA
===================================================== */

function cargar(){

    const parametros =
        new URLSearchParams(window.location.search);

    const pagina =
        parametros.get("pagina") || "inicio";

    const app =
        document.getElementById("app");


    if(pagina === "inicio"){

        app.innerHTML =
            inicio();

    }

    else if(pagina === "candidatos"){

        app.innerHTML =
            candidatosPagina();

    }

    else if(pagina === "propuestas"){

        app.innerHTML =
            propuestasPagina();

    }

    else if(pagina === "distrito"){

        app.innerHTML =
            distritoPagina();

    }

    else if(pagina === "fuentes"){

        app.innerHTML =
            fuentesPagina();

    }

    else if(pagina.startsWith("candidato")){

        const numero =
            parseInt(
                pagina.replace("candidato","")
            );

        const candidato =
            candidatos.find(
                c => c.id === numero
            );

        if(candidato){

            app.innerHTML =
                candidatoPagina(candidato);

        }

        else{

            app.innerHTML =
                inicio();

        }

    }

    else{

        app.innerHTML =
            inicio();

    }

}


/* =====================================================
   INICIAR
===================================================== */

cargar();
